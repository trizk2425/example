<!-- Cambridge Entrepreneurship Programme Ad -->
<style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&family=Playfair+Display:ital,wght@0,700;1,700&display=swap');

    .cam-ad-container {
        /* Golden gradient background */
        background: linear-gradient(135deg, #FFD700 0%, #F5B201 100%);
        color: #111111;
        font-family: 'Montserrat', sans-serif;
        border-radius: 20px;
        max-width: 850px;
        margin: 40px auto;
        padding: 45px 50px;
        box-shadow: 0 15px 35px rgba(255, 215, 0, 0.25), 0 5px 15px rgba(0, 0, 0, 0.05);
        display: flex;
        align-items: center;
        gap: 40px;
        position: relative;
        overflow: hidden;
    }

    /* Subtle geometric background pattern */
    .cam-ad-container::before {
        content: '';
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: radial-gradient(circle, rgba(255,255,255,0.3) 10%, transparent 10%),
                    radial-gradient(circle, rgba(255,255,255,0.3) 10%, transparent 10%);
        background-size: 50px 50px;
        background-position: 0 0, 25px 25px;
        opacity: 0.6;
        transform: rotate(15deg);
        pointer-events: none;
    }

    .cam-ad-content {
        flex: 1;
        position: relative;
        z-index: 2;
    }

    .cam-ad-tagline {
        text-transform: uppercase;
        font-size: 14px;
        font-weight: 800;
        letter-spacing: 2px;
        color: #C24A00; /* Subtle rust accent */
        margin-bottom: 12px;
        display: block;
    }

    .cam-ad-title {
        font-family: 'Playfair Display', serif;
        font-size: 42px;
        line-height: 1.15;
        margin: 0 0 15px 0;
        color: #000000;
    }

    .cam-ad-title span {
        color: #003366; /* Cambridge Blue contrast */
    }

    .cam-ad-desc {
        font-size: 17px;
        line-height: 1.7;
        margin: 0 0 30px 0;
        color: #222222;
        font-weight: 400;
    }

    .cam-ad-btn {
        background-color: #003366;
        color: #ffffff;
        text-decoration: none;
        padding: 16px 36px;
        font-size: 16px;
        font-weight: 600;
        border-radius: 50px;
        display: inline-flex;
        align-items: center;
        gap: 12px;
        transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        box-shadow: 0 6px 20px rgba(0, 51, 102, 0.25);
    }

    /* Button Hover Effects */
    .cam-ad-btn:hover {
        background-color: #001f3f;
        transform: translateY(-4px);
        box-shadow: 0 10px 25px rgba(0, 51, 102, 0.4);
    }

    .cam-ad-btn svg {
        transition: transform 0.3s ease;
    }

    .cam-ad-btn:hover svg {
        transform: translateX(5px);
    }

    .cam-ad-graphic {
        flex: 0 0 220px;
        position: relative;
        z-index: 2;
    }

    /* Floating animation for the vector graphic */
    @keyframes float-graphic {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-18px); }
        100% { transform: translateY(0px); }
    }

    .cam-ad-graphic svg {
        width: 100%;
        height: auto;
        animation: float-graphic 5s ease-in-out infinite;
        filter: drop-shadow(0 20px 20px rgba(0,0,0,0.15));
    }

    /* Mobile Responsiveness */
    @media (max-width: 768px) {
        .cam-ad-container {
            flex-direction: column-reverse;
            text-align: center;
            padding: 40px 25px;
            gap: 20px;
        }
        .cam-ad-graphic {
            flex: 0 0 auto;
            width: 160px;
            margin: 0 auto;
        }
    }
</style>

<div class="cam-ad-container">
    <div class="cam-ad-content">
        <span class="cam-ad-tagline">University of Cambridge</span>
        <h2 class="cam-ad-title">Master's in <span>Entrepreneurship</span></h2>
        <p class="cam-ad-desc">
            Transform your vision into a viable venture. Join a global network of innovators and learn from world-class experts without stepping away from your current role.
        </p>
        <a href="https://www.jbs.cam.ac.uk/programmes/entrepreneurship/" target="_blank" class="cam-ad-btn">
            Discover the Programme
            <!-- Arrow Icon -->
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="5" y1="12" x2="19" y2="12"></line>
                <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
        </a>
    </div>
    
    <div class="cam-ad-graphic">
        <!-- Floating Lightbulb & Gear Graphic SVG -->
        <svg viewBox="0 0 200 250" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="bulbGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#ffffff"/>
                    <stop offset="100%" stop-color="#f0f0f0"/>
                </linearGradient>
            </defs>
            <!-- Glowing background aura -->
            <circle cx="100" cy="100" r="80" fill="#ffffff" opacity="0.3" filter="blur(15px)"/>
            
            <!-- Main Bulb Shape -->
            <path d="M100 20 C60 20 30 50 30 90 C30 115 45 136 65 148 L65 180 C65 185 69 190 75 190 L125 190 C131 190 135 185 135 180 L135 148 C155 136 170 115 170 90 C170 50 140 20 100 20 Z" fill="url(#bulbGradient)" stroke="#003366" stroke-width="8"/>
            
            <!-- Bulb Base -->
            <path d="M70 190 L130 190 L125 210 L75 210 Z" fill="#003366"/>
            <path d="M85 210 L115 210 L110 225 L90 225 Z" fill="#333333"/>
            
            <!-- Inner Brain/Gear detail representing innovation -->
            <circle cx="100" cy="85" r="30" fill="none" stroke="#003366" stroke-width="6" stroke-dasharray="10 6"/>
            <circle cx="100" cy="85" r="15" fill="#C24A00"/>
            <line x1="100" y1="115" x2="100" y2="140" stroke="#003366" stroke-width="6"/>
            
            <!-- Shine reflection -->
            <path d="M45 70 C50 45 70 35 90 35" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
        </svg>
    </div>
</div>
<!-- End of Ad -->
